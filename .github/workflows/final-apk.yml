name: RULEBREAK final APK gate

on:
  workflow_dispatch:
    inputs:
      physical_qa_ready:
        description: 'Confirm internal automated gates are closed and this APK is now the physical-device QA candidate'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rulebreak-final-apk
  cancel-in-progress: true

jobs:
  final-apk:
    if: ${{ inputs.physical_qa_ready == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android build packages
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Install Godot 4.3 and export templates
        run: |
          set -euo pipefail
          V="4.3"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${V}.stable"
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${V}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz"
          rm -rf /tmp/templates "$TEMPLATE_DIR"
          mkdir -p /tmp/templates "$TEMPLATE_DIR"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          for template in android_source.zip android_debug.apk android_release.apk; do
            test -s "/tmp/templates/templates/$template"
            cp -f "/tmp/templates/templates/$template" "$TEMPLATE_DIR/$template"
          done
          rm -rf android/build
          mkdir -p android/build
          unzip -q /tmp/templates/templates/android_source.zip -d android/build
          test -f android/build/build.gradle
          godot --version
      - name: Configure debug signing environment
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Run final automated gates
        run: |
          set -euo pipefail
          python3 tests/test_static_integrity.py
          python3 tests/test_release_documentation.py
          python3 tests/test_release_contract.py
          timeout 60s godot --headless --path . --check-only --script scripts/game.gd
          timeout 60s godot --headless --path . --check-only --script scripts/core/challenge_view_v2.gd
          timeout 60s godot --headless --path . --check-only --script scripts/core/progression.gd
          timeout 60s godot --headless --path . --check-only --script scripts/core/audio_feedback.gd
          timeout 90s godot --headless --path . --script tests/test_challenge_manager.gd
          timeout 90s godot --headless --path . --script tests/test_challenge_view.gd
          timeout 90s godot --headless --path . --script tests/test_family_behavior_contract.gd
          timeout 180s godot --headless --path . --script tests/test_all_challenge_render_contract.gd
          timeout 90s godot --headless --path . --script tests/test_localization.gd
          timeout 90s godot --headless --path . --script tests/test_game_rule_fallback.gd
          timeout 90s godot --headless --path . --script tests/test_localization_fallback_coverage.gd
          timeout 90s godot --headless --path . --audio-driver Dummy --script tests/test_audio_feedback.gd
          timeout 90s godot --headless --path . --script tests/test_progression.gd
          timeout 90s godot --headless --path . --script tests/test_gameplay_loop.gd
      - name: Export Android debug APK
        run: |
          set -euo pipefail
          mkdir -p build/android
          timeout 180s godot --headless --path . --export-debug "Android Debug" build/android/rulebreak-debug.apk
          test -s build/android/rulebreak-debug.apk
      - name: Verify APK manifest identity
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging build/android/rulebreak-debug.apk | tee /tmp/apk-badging.txt
          grep -F "package: name='com.rulebreak.game' versionCode='1' versionName='0.1.0'" /tmp/apk-badging.txt
          grep -F "sdkVersion:'24'" /tmp/apk-badging.txt
          grep -F "targetSdkVersion:'36'" /tmp/apk-badging.txt
          unzip -l build/android/rulebreak-debug.apk | grep -F 'lib/arm64-v8a/'
          ! unzip -l build/android/rulebreak-debug.apk | grep -E 'lib/(armeabi-v7a|x86|x86_64)/'
      - name: Record APK checksum
        run: |
          set -euo pipefail
          sha256sum build/android/rulebreak-debug.apk | tee build/android/rulebreak-debug.apk.sha256
          cat > build/android/rulebreak-debug.apk.metadata.txt <<EOF
          artifact_type=debug-apk
          source_commit=${GITHUB_SHA}
          version_name=0.1.0
          version_code=1
          build_run=${GITHUB_RUN_ID}
          build_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          signed=debug-keystore
          purpose=physical-android-qa
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: rulebreak-final-physical-qa-apk
          path: |
            build/android/rulebreak-debug.apk
            build/android/rulebreak-debug.apk.sha256
            build/android/rulebreak-debug.apk.metadata.txt
          if-no-files-found: error
