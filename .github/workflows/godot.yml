name: Godot 4.3 verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Godot 4.3 stable
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64

      - name: Install Godot 4.3 Android export templates
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 \
            -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          find /tmp/godot-templates -type f -name 'android_debug.apk' -print -exec cp {} "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk" \;
          find /tmp/godot-templates -type f -name 'android_release.apk' -print -exec cp {} "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk" \;
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"
          ls -lh "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Android SDK and Java for Godot
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -d "/usr/local/lib/android/sdk" ]; then
              ANDROID_HOME="/usr/local/lib/android/sdk"
            elif [ -d "$HOME/Android/Sdk" ]; then
              ANDROID_HOME="$HOME/Android/Sdk"
            else
              echo "Android SDK not found on runner"
              exit 1
            fi
          fi

          JAVA_HOME="${JAVA_HOME:?JAVA_HOME was not configured by setup-java}"
          export JAVA_HOME
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          test -x "$JAVA_HOME/bin/java"
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "PATH=$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" >> "$GITHUB_ENV"

          echo "java version:"
          java -version
          echo "Android SDK: $ANDROID_HOME"
          echo "Godot Java SDK path: $JAVA_HOME"
          echo "Godot Android SDK path: $ANDROID_HOME"

          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_HOME"
export/android/java_sdk_path = "$JAVA_HOME"
EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Validate required Android SDK components
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" --list >/tmp/sdkmanager-list.txt
          for path in \
            "$ANDROID_HOME/platform-tools/adb" \
            "$ANDROID_HOME/build-tools/34.0.0/aapt" \
            "$ANDROID_HOME/platforms/android-34/android.jar" \
            "$ANDROID_HOME/ndk/23.2.8568313" \
            "$ANDROID_HOME/cmake/3.10.2.4988404"; do
            test -e "$path" || { echo "Missing Android SDK component: $path"; exit 1; }
          done

      - name: Validate project import
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit --verbose 2>&1 | tee /tmp/godot-import.log

      - name: Run deterministic ChallengeManager test
        run: |
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --script tests/test_challenge_manager.gd

      - name: Run deterministic ChallengeView timing/state test
        run: |
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --script tests/test_challenge_view.gd

      - name: Run runtime CSV localization test
        run: |
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --script tests/test_localization.gd

      - name: Export Android debug APK
        run: |
          set -euo pipefail
          mkdir -p build/android
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug "Android Debug" build/android/rulebreak-debug.apk 2>&1 | tee /tmp/godot-android-export.log
          test -s build/android/rulebreak-debug.apk
          ls -lh build/android/rulebreak-debug.apk

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rulebreak-android-debug
          path: build/android/rulebreak-debug.apk
          if-no-files-found: error
