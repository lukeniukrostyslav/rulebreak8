name: Godot 4.3 verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Runner preflight
        run: |
          set -euo pipefail
          echo "godot-workflow-started"
          uname -a
          test "$RUNNER_OS" = "Linux"
