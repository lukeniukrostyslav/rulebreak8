name: Godot 4.3 verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Runner preflight
        run: |
          set -euo pipefail
          echo "godot-workflow-started"
          uname -a
          test "$RUNNER_OS" = "Linux"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: |
          set -euo pipefail
          java -version
          test -n "$JAVA_HOME"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Verify Android SDK bootstrap
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          test -x "$(command -v sdkmanager)"
          sdkmanager --version

      - name: Verify repository files
        run: |
          set -euo pipefail
          test -f project.godot
          test -f export_presets.cfg
