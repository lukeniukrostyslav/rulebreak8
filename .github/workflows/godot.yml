name: Godot 4.3 verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rulebreak-godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Runner preflight
        run: |
          set -euo pipefail
          echo "godot-workflow-started"
          uname -a
          test "$RUNNER_OS" = "Linux"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: |
          set -euo pipefail
          java -version
          test -n "$JAVA_HOME"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Verify Android SDK
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          test -x "$(command -v sdkmanager)"
          sdkmanager --version
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Install Godot 4.3 stable
        run: |
          set -euo pipefail
          GODOT_VERSION="4.3"
          BASE_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o /tmp/godot.zip "$BASE_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Configure Godot Android editor settings
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -f "$HOME/.config/godot/editor_settings-4.3.tres"
          test -f "$HOME/.android/debug.keystore"
          test -d "$ANDROID_HOME/platform-tools"
          test -x "$JAVA_HOME/bin/java"

      - name: Install Godot export templates
        run: |
          set -euo pipefail
          GODOT_VERSION="4.3"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          rm -rf /tmp/templates "$TEMPLATE_DIR"
          mkdir -p /tmp/templates "$TEMPLATE_DIR"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          test -f /tmp/templates/templates/android_source.zip
          cp -f /tmp/templates/templates/android_source.zip "$TEMPLATE_DIR/android_source.zip"
          cp -f /tmp/templates/templates/android_debug.apk "$TEMPLATE_DIR/android_debug.apk"
          cp -f /tmp/templates/templates/android_release.apk "$TEMPLATE_DIR/android_release.apk"
          test -s "$TEMPLATE_DIR/android_source.zip"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          rm -rf android/build
          mkdir -p android/build
          unzip -q /tmp/templates/templates/android_source.zip -d android/build
          test -f android/build/build.gradle

      - name: Validate repository integrity
        run: |
          set -euo pipefail
          python3 tests/test_static_integrity.py

      - name: Validate project through headless runtime tests
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . --script tests/test_challenge_manager.gd
          timeout 90s godot --headless --path . --script tests/test_challenge_view.gd
          timeout 90s godot --headless --path . --script tests/test_localization.gd
          timeout 90s godot --headless --path . --script tests/test_game_rule_fallback.gd

      - name: Prepare translations without Godot CSV importer
        run: |
          set -euo pipefail
          cat > /tmp/generate_translations.gd <<'GDSCRIPT'
          extends SceneTree
          const LocalizationScript = preload("res://scripts/core/localization.gd")
          const LOCALES := ["en", "es", "pt_BR", "fr", "de", "it", "ru", "uk", "pl", "tr", "nl", "ar", "he", "hi", "id", "vi", "th", "ja", "ko", "zh", "zh_TW"]
          const SOURCES := ["challenges", "extra_a", "extra_b", "ui_translations"]
          func _init() -> void:
              var localization = LocalizationScript.new()
              for locale in LOCALES:
                  for source in SOURCES:
                      var translation = localization._build_translation_from_csv(source, locale)
                      if translation == null:
                          push_error("Failed to generate %s.%s.translation" % [source, locale])
                          quit(1)
                          return
                      var path = "res://locale/%s.%s.translation" % [source, locale]
                      var err = ResourceSaver.save(translation, path)
                      if err != OK:
                          push_error("Failed to save %s: %s" % [path, err])
                          quit(1)
                          return
              quit(0)
          GDSCRIPT
          timeout 90s godot --headless --path . --script /tmp/generate_translations.gd
          test -s locale/challenges.en.translation
          test -s locale/ui_translations.ru.translation
          rm -f locale/*.csv
          test -z "$(find locale -maxdepth 1 -name '*.csv' -print -quit)"

      - name: Reset Godot import cache before export
        run: |
          set -euo pipefail
          rm -rf .godot
          test ! -d .godot

      - name: Export Android debug APK
        run: |
          set -euo pipefail
          mkdir -p build/android
          timeout 180s godot --headless --path . --export-debug "Android Debug" build/android/rulebreak-debug.apk
          test -s build/android/rulebreak-debug.apk
          file build/android/rulebreak-debug.apk
          unzip -t build/android/rulebreak-debug.apk >/dev/null
          unzip -l build/android/rulebreak-debug.apk | grep -F 'lib/arm64-v8a/libgodot_android.so'
          unzip -l build/android/rulebreak-debug.apk | grep -F 'AndroidManifest.xml'

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rulebreak-android-debug
          path: build/android/rulebreak-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.1.0-debug.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build/android/rulebreak-debug.apk \
            --title "RULEBREAK Android Debug $TAG" \
            --notes "Verified Godot 4.3 Android debug APK built from commit ${GITHUB_SHA}. This is a development/debug build, not a Google Play signed AAB."

# Android verification pipeline: reproducible Godot 4.3 + Android SDK/NDK/CMake build.
