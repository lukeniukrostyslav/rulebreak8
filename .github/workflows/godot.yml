name: Godot 4.3 verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Runner preflight
        run: |
          set -euo pipefail
          echo "godot-workflow-started"
          uname -a
          test "$RUNNER_OS" = "Linux"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: |
          set -euo pipefail
          java -version
          test -n "$JAVA_HOME"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Verify Android SDK
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          test -x "$(command -v sdkmanager)"
          sdkmanager --version
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

      - name: Install Godot 4.3
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Install Godot export templates
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -fsSL -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          test -d /tmp/templates/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"

      # Godot 4.3 has known Linux/headless editor-import failure modes. The
      # editor import pass is not required for project validation or export:
      # the headless test runs and export command perform the actual resource
      # loading/import work needed by this project. Keeping a separate editor
      # process here made CI fail before the real tests could execute.
      - name: Validate project through headless runtime tests
        run: |
          set -euo pipefail
          godot --headless --path . --script tests/test_challenge_manager.gd
          godot --headless --path . --script tests/test_challenge_view.gd
          godot --headless --path . --script tests/test_localization.gd

      - name: Export Android debug APK
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --path . --export-debug "Android Debug" build/android/rulebreak-debug.apk
          test -s build/android/rulebreak-debug.apk
          file build/android/rulebreak-debug.apk
          unzip -l build/android/rulebreak-debug.apk | grep -E '(^|/)lib/arm64-v8a/'

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rulebreak-android-debug
          path: build/android/rulebreak-debug.apk
          if-no-files-found: error

# Android verification pipeline: minimal SDK components, reproducible and credential-free.
