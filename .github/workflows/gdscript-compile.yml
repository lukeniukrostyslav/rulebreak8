name: RULEBREAK GDScript compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gdscript-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Compile critical scripts
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path . --check-only --script scripts/game.gd
          timeout 60s godot --headless --path . --check-only --script scripts/core/challenge_view_v2.gd
          timeout 60s godot --headless --path . --check-only --script scripts/core/progression.gd
          timeout 60s godot --headless --path . --check-only --script scripts/core/audio_feedback.gd
          echo "RULEBREAK GDScript compile: PASS"
