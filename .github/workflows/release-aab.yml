name: Android release artifact verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rulebreak-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android build packages
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Install Godot 4.3 and export templates
        run: |
          set -euo pipefail
          V=4.3
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${V}.stable"
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${V}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz"
          rm -rf /tmp/templates "$TEMPLATE_DIR"
          mkdir -p /tmp/templates "$TEMPLATE_DIR"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          test -f /tmp/templates/templates/android_source.zip
          cp -f /tmp/templates/templates/android_source.zip "$TEMPLATE_DIR/android_source.zip"
          cp -f /tmp/templates/templates/android_debug.apk "$TEMPLATE_DIR/android_debug.apk"
          cp -f /tmp/templates/templates/android_release.apk "$TEMPLATE_DIR/android_release.apk"
          test -s "$TEMPLATE_DIR/android_source.zip"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          rm -rf android/build
          mkdir -p android/build
          unzip -q /tmp/templates/templates/android_source.zip -d android/build
          test -f android/build/build.gradle
          godot --version
      - name: Configure debug signing environment for Godot export
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Validate repository integrity
        run: |
          set -euo pipefail
          python3 tests/test_static_integrity.py
      - name: Run runtime gates
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . --script tests/test_challenge_manager.gd
          timeout 90s godot --headless --path . --script tests/test_challenge_view.gd
          timeout 90s godot --headless --path . --script tests/test_localization.gd
          timeout 90s godot --headless --path . --script tests/test_game_rule_fallback.gd
          timeout 90s godot --headless --path . --script tests/test_progression.gd
      - name: Prepare translations without Godot CSV importer
        run: |
          set -euo pipefail
          cat > /tmp/generate_translations.gd <<'GDSCRIPT'
          extends SceneTree
          const LocalizationScript = preload("res://scripts/core/localization.gd")
          const LOCALES := ["en", "es", "pt_BR", "fr", "de", "it", "ru", "uk", "pl", "tr", "nl", "ar", "he", "hi", "id", "vi", "th", "ja", "ko", "zh", "zh_TW"]
          const SOURCES := ["challenges", "extra_a", "extra_b", "ui_translations"]
          func _init() -> void:
              var localization = LocalizationScript.new()
              for locale in LOCALES:
                  for source in SOURCES:
                      var translation = localization._build_translation_from_csv(source, locale)
                      if translation == null:
                          push_error("Failed to generate %s.%s.translation" % [source, locale])
                          quit(1)
                          return
                      var path = "res://locale/%s.%s.translation" % [source, locale]
                      var err = ResourceSaver.save(translation, path)
                      if err != OK:
                          push_error("Failed to save %s: %s" % [path, err])
                          quit(1)
                          return
              quit(0)
          GDSCRIPT
          timeout 90s godot --headless --path . --script /tmp/generate_translations.gd
          test -s locale/challenges.en.translation
          test -s locale/ui_translations.ru.translation
          rm -f locale/*.csv
          test -z "$(find locale -maxdepth 1 -name '*.csv' -print -quit)"
      - name: Export unsigned release AAB
        run: |
          set -euo pipefail
          mkdir -p build/android
          timeout 180s godot --headless --path . --export-release "Android Release AAB (Unsigned)" build/android/rulebreak-release.aab
          test -s build/android/rulebreak-release.aab
          unzip -t build/android/rulebreak-release.aab >/dev/null
          unzip -l build/android/rulebreak-release.aab | grep -F 'AndroidManifest.xml'
          unzip -l build/android/rulebreak-release.aab | grep -F 'base/'
      - uses: actions/upload-artifact@v4
        with:
          name: rulebreak-android-release-aab
          path: build/android/rulebreak-release.aab
          if-no-files-found: error
