name: Temporary GDScript type fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix ambiguous array element types
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/core/challenge_view_v2.gd")
          s = p.read_text(encoding="utf-8")
          s = s.replace("var value:=DIRECTIONS[i]", "var value: String = DIRECTIONS[i]")
          s = s.replace("var value:=values[i]", "var value: String = values[i]")
          p.write_text(s, encoding="utf-8")
          PY
          git diff --check
      - name: Commit fix if needed
        shell: bash
        run: |
          if git diff --quiet -- scripts/core/challenge_view_v2.gd; then
            echo "No type fix needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/core/challenge_view_v2.gd
          git commit -m "Fix GDScript inferred array element types"
          git push
